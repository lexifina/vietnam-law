<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pháp luật Việt Nam qua 20 biểu đồ</title>
<meta name="description" content="Hai mươi biểu đồ về pháp luật Việt Nam từ kho lưu trữ vietnam-law / Twenty charts on Vietnamese law from the vietnam-law repository">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Noto Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.25 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; line-height: 1.5; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.35 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.45 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 1.5px dashed var(--text-3); border-radius: 3px; }
.legend i.square { background: transparent !important; border: 2px solid var(--text); border-radius: 2px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.lbl.big { font-size: 13px; font-weight: 600; fill: var(--text); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.2 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 4px 0 10px; }
.card { background: var(--surface-2); border-radius: 12px; padding: 12px 14px 10px; min-width: 0; }
.card .cn { font: 600 13px/1.4 var(--sans); color: var(--text); }
.card .cs { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.card .cv { font-size: 12px; color: var(--text-2); margin: 4px 0 2px; }
.card .cv b { font: 600 24px/1.2 var(--sans); color: var(--text); margin-right: 3px; font-variant-numeric: tabular-nums; }
.card .cbar { display: flex; height: 6px; margin: 8px 0 4px; border-radius: 3px; overflow: hidden; background: var(--line); }
.card .cbar i { display: block; height: 100%; }
.crimes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin: 6px 0 4px; }
.crime { border-radius: 10px; padding: 9px 11px 9px 13px; position: relative; background: var(--surface-2); min-width: 0; }
.crime::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 3px 3px 0; background: var(--cc); }
.crime .ca { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.crime .ct { font: 500 13px/1.4 var(--sans); color: var(--text); margin: 1px 0 3px; }
.crime.gone .ct { color: var(--text-2); }
.crime .cx { font-size: 11px; color: var(--text-3); line-height: 1.45; }
.crime .chip { display: inline-block; font-size: 11px; line-height: 1.6; padding: 0 8px; border-radius: 999px; margin-right: 6px; }
.crime .chip.strike { text-decoration: line-through; color: var(--text-3); background: var(--line); }
.crime.kept { background: color-mix(in srgb, var(--s8) 9%, var(--surface-2)); }
.grp { font: 600 12px/1.4 var(--sans); color: var(--text-2); margin: 12px 0 2px; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; line-height: 1.6; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { padding: 10px 11px 8px; }
  .card .cv b { font-size: 20px; }
  .crimes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .crime { padding: 8px 8px 8px 11px; }
  .crime .ct { font-size: 12px; }
  .crime .cx span:not(.chip) { display: block; margin-top: 2px; }
  .ptiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ptiles.three .pv b { font-size: 19px; }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Ngôn ngữ / Language"><button data-lang="vi">VI</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Giao diện / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile, ACTS = DATA.acts, LAWS = DATA.laws;
const LANGS = ['vi', 'en'];
let LANG = 'vi';
try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) LANG = q; else { const s = localStorage.getItem('vn-viz-lang'); if (LANGS.includes(s)) LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const tt = localStorage.getItem('vn-viz-theme'); if (tt === 'light' || tt === 'dark') THEME = tt; } catch (e) {}

// ------------------------------------------------------------------ strings
const GL = '<a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>';
const S = {
vi: {
  title: 'Pháp luật Việt Nam qua 20 biểu đồ',
  lede: 'Hai mươi biểu đồ vẽ hoàn toàn từ dữ liệu của kho lưu trữ này: {acts} văn bản của Quốc hội (Hiến pháp năm 2013, sáu bộ luật và {laws} luật), mỗi điều một tệp, cùng mọi lần sửa đổi, bổ sung đã có hiệu lực đến ngày 1 tháng 10 năm 2026, và danh sách {named} luật mà hồ sơ nêu tên.',
  profile_h: 'Hồ sơ dữ liệu: những gì đã dùng và mức độ đầy đủ',
  tbl: 'Bảng dữ liệu', src: 'Nguồn trong kho lưu trữ', n: 'Bản ghi', cover: 'Phạm vi', caveat: 'Giới hạn',
  ds: 'Dữ liệu', foot: 'Dựng từ kho lưu trữ lexifina/vietnam-law ({built}). Văn bản pháp luật lấy từ vbpl.vn (Cơ sở dữ liệu quốc gia về pháp luật) và Công báo (congbao.chinhphu.vn), dữ liệu đến ngày {record}. Các con số do visualisations/src/prep.py tính từ lịch sử git, văn bản của từng điều và các bảng trong data/; build.py dựng trang. Mọi biểu đồ chỉ mô tả hồ sơ ghi lại những gì, không giải thích vì sao.',
  total: 'Tổng', share: 'Tỷ lệ', partial: 'chưa hết năm',
  gl: 'Biểu đồ về pháp luật của mọi quốc gia, từ toàn bộ global-law: ' + GL + '. Trang này chỉ gồm các biểu đồ về Việt Nam.',
},
en: {
  title: 'Vietnamese law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: {acts} acts of the National Assembly (the Constitution of 2013, six codes and {laws} laws), one file per article, with every amendment in force up to 1 October 2026, and the list of the {named} laws the record names.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/vietnam-law repository ({built}). The legal text is from vbpl.vn (the national legal database) and the Official Gazette (congbao.chinhphu.vn), data as of {record}. The numbers are computed by visualisations/src/prep.py from the git history, the text of every article and the tables in data/; build.py assembles the page. All charts are descriptive: they show what the record holds, not why.',
  total: 'Total', share: 'Share', partial: 'partial year',
  gl: 'Charts on every country’s law, from the whole of global-law: ' + GL + '. These are the charts on Vietnam alone.',
}};
const t = k => S[LANG][k];
const L = (vi, en) => LANG === 'vi' ? vi : en;
const LA = a => Array.isArray(a) ? L(a[0], a[1]) : a;
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'vi' ? '.' : ',');
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d); const [a, b] = s.split('.'); return (+v < 0 && +s !== 0 ? '−' : '') + grp(a) + (b ? (LANG === 'vi' ? ',' : '.') + b : ''); };
const fmt = n => (n == null ? '–' : Number.isInteger(+n) ? (+n < 0 ? '−' : '') + grp(String(Math.abs(Math.round(+n)))) : dec(+n, 1));
const pv = (v, d = 0) => dec(v, d) + '%';
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { vi: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'vi' ? `${d} tháng ${m} năm ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'vi' ? `${d}/${m}/${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const monthTxt = s => { const [y, m] = s.split('-').map(Number); return LANG === 'vi' ? `tháng ${m}/${y}` : `${MEN[m - 1]} ${y}`; };
const monShort = s => { const [y, m] = s.split('-').map(Number); return LANG === 'vi' ? `${m}/${y}` : `${MON.en[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const DAYS = (a, b) => Math.round((PD(b) - PD(a)) / 864e5);
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const yrs = d => d / 365.25;
const NUMW = { vi: ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín', 'mười'], en: ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'] };
const numW = n => n <= 10 ? NUMW[LANG][n] : fmt(n);
const andL = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + (LANG === 'vi' ? ' và ' : ' and ') + a[a.length - 1];
const theL = a => LANG === 'en' ? a.map(s => 'the ' + s) : a;
const yrTxt = d => LANG === 'vi' ? `${dec(yrs(d), 1)} năm` : `${dec(yrs(d), 1)} years`;

// ------------------------------------------------------------------ names
const ROM = { QH10: 'X', QH11: 'XI', QH12: 'XII', QH13: 'XIII', QH14: 'XIV', QH15: 'XV', QH16: 'XVI' };
const ORD = { QH10: '10th', QH11: '11th', QH12: '12th', QH13: '13th', QH14: '14th', QH15: '15th', QH16: '16th' };
const SPAN = () => D.c02.span;
const termShort = q => L(`Khóa ${ROM[q]}`, ORD[q]);
const termName = q => L(`khóa ${ROM[q]}`, `the ${ORD[q]} National Assembly`);
const termYears = q => { const s = SPAN()[q]; return s ? (s[0] === s[1] ? s[0] : `${s[0]}–${s[1]}`) : ''; };

}

// rows of 100% bands with rounded ends and the shares inside; the label column is sized to its labels
function bands(el, rows, keys, colors, names, opt) {
  const w = W(el), nw = narrow(w), lneed = textW(el, rows.map(r => opt.label(r, nw))) + 12, cap = nw ? (opt.lcap || 150) : 400;
  const above = lneed > cap, rowH = (opt.rowH || 34) + (above ? 14 : 0), lw = above ? 0 : lneed;
  const rw = Math.min(nw ? 80 : 120, textW(el, rows.map(r => opt.right(r, nw))) + 12);
  const m = { t: 4, r: rw, b: 22, l: lw };
  const h = m.t + m.b + rowH * rows.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
  [0, .25, .5, .75, 1].forEach(v => g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', rowH * rows.length + 14).attr('text-anchor', 'middle').text(pv(100 * v)));
  const id0 = 'bd' + (++HATCH);

      if (x1 - x0 > (opt.minIn || (nw ? 30 : 34))) row.append('text').attr('class', 'lbl').attr('x', (x0 + x1) / 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'middle')

  const BK = [[0, 0], [1, 7], [8, 30], [31, 44], [45, 90], [91, 180], [181, 365], [366, 730], [731, 1e9]];

    dek: L(`Số ngày từ khi Quốc hội thông qua đến ngày đầu tiên phần văn bản của luật trong hồ sơ có hiệu lực, cho ${fmt(Lw.length)} luật có cả hai ngày. Luật Ban hành văn bản quy phạm pháp luật năm 2025 (Điều 53) quy định thời điểm có hiệu lực không sớm hơn 45 ngày kể từ ngày thông qua, trừ văn bản theo trình tự, thủ tục rút gọn và trường hợp đặc biệt. Trung vị là ${fmt(med(pre))} ngày với các luật thông qua trước năm 2025 và ${fmt(Math.round(med(post)))} ngày từ năm 2025; ${fmt(wk)} luật từ năm 2025 có hiệu lực trong vòng 7 ngày.`,

          d => `<b>${esc(Cap(d.n))}</b>` + trow(cA, L('Trước năm 2025', 'Before 2025'), fmt(d.a.length)) + trow(cB, L('Từ năm 2025', 'Since 2025'), fmt(d.b.length))

// stacked columns, keys bottom-up; the top segment gets the rounded end, 1px surface gaps
function stackedColumns(el, rows, keys, colors, names, opt = {}) {
  const w = W(el), h = opt.h || 300, m = { t: 18, r: 8, b: 26, l: 40 };
  const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const x = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(opt.pad == null ? 0.25 : opt.pad);
  const tot = r => keys.reduce((s, k) => s + (r[k] || 0), 0);
  const y = d3.scaleLinear().domain([0, opt.max || d3.max(rows, tot)]).nice().range([ih, 0]);
  yAxis(g, y, iw, opt.ticks || 5, opt.yf);
  const bw = Math.min(opt.bw || 24, x.bandwidth());
  rows.forEach(r => {
    let acc = 0; const segs = keys.map((k, i) => ({ k, i, v: r[k] || 0 })).filter(s => s.v > 0);
    const gx = x(r.y) + (x.bandwidth() - bw) / 2;
    segs.forEach((s, j) => {
      const y0 = y(Math.min(acc, y.domain()[1])), y1 = y(Math.min(acc + s.v, y.domain()[1])); acc += s.v;
      const gap = j ? 1 : 0, top = j === segs.length - 1;
      const yy0 = y0 - gap, yy1 = top ? y1 : y1 + 1;
      if (yy0 - yy1 < 0.5) return;
      g.append('path').attr('d', top ? colPath(gx, yy0, bw, yy1) : `M${gx},${yy0}V${yy1}H${gx + bw}V${yy0}Z`).attr('fill', colors[s.i]).attr('opacity', opt.partial && opt.partial(r) ? 0.55 : 1);
    });
    if (opt.topLabel) g.append('text').attr('class', 'lbl').attr('x', gx + bw / 2).attr('y', y(Math.min(tot(r), y.domain()[1])) - 5).attr('text-anchor', 'middle').text(opt.topLabel(r));
  });
  g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
  const every = opt.every || Math.ceil(rows.length / Math.max(4, Math.floor(iw / 44)));
  rows.forEach((r, i) => { if (i % every === 0 || i === rows.length - 1) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(opt.xf ? opt.xf(r.y) : r.y); });
  bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', x.bandwidth()).attr('y', 0).attr('height', ih),
    r => `<b>${r.y}${opt.partial && opt.partial(r) ? ' (' + t('partial') + ')' : ''}</b>` + keys.map((k, i) => (r[k] ? trow(colors[i], names[i], fmt(r[k]) + (opt.noShare ? '' : ` · ${pct(r[k], tot(r))}`)) : '')).reverse().join('') + trow(null, t('total'), fmt(tot(r))));
  return { svg, g, x, y, iw, ih, bw };
}

      const w = W(el), nw = narrow(w), years = d3.range(1999, 2027), by = new Map(years.map(y => [y, []]));
      const ordB = { c1992: 0, c2001: 1, self: 2, c2013: 3, c2025: 4 };
      A.slice().sort((a, b) => ordB[a[2]] - ordB[b[2]] || (a[1] < b[1] ? -1 : 1)).forEach(r => by.get(+r[1].slice(0, 4)).push(r));

      const pts = [];

        pts.push({ r, cx, cy });
      }));
      bindTip(g.selectAll('.hit').data(pts).join('rect').attr('class', 'hit').attr('x', p => p.cx - step / 2).attr('y', p => p.cy - dy / 2).attr('width', step).attr('height', dy),
        p => `<b>${esc(actName(p.r[0]))}</b><div class="q">${esc(actNum(p.r[0]))} · ${dateShort(p.r[1])}</div>` + trow(cols[p.r[2]], L('Căn cứ', 'Rests on'), esc(names[p.r[2]] || '–')) + (REPL.has(p.r[0]) ? `<div class="q">${L('Đã được thay thế bởi ', 'Replaced by ')}${esc(actName(REPL.get(p.r[0])[1]))}</div>` : ''));
      note(el, ['<KIND>/<YEAR>/<NUMBER>/loi-mo-dau.md'], L(`${fmt(A.length)} văn bản`, `${fmt(A.length)} acts`),
        L('hiến pháp đọc từ phần “Căn cứ …” của văn bản: có “1992” và “51/2001” là Hiến pháp năm 1992 đã sửa đổi; chỉ có “1992” là Hiến pháp năm 1992; có “203/2025” là Hiến pháp năm 2013 đã sửa đổi năm 2025; các văn bản khác căn cứ “Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam” (năm 2013).',
          'the constitution is read from the act’s “Căn cứ …” (pursuant to) preamble: “1992” with “51/2001” is the 1992 Constitution as amended; “1992” alone the 1992 Constitution; “203/2025” the 2013 Constitution as amended in 2025; the other acts cite the “Constitution of the Socialist Republic of Vietnam” (of 2013).'));
      table(el, [L('Hiến pháp được viện dẫn', 'Constitution cited'), L('Văn bản', 'Acts'), L('trong đó đã được thay thế', 'of which replaced')], ['c1992', 'c2001', 'c2013', 'c2025'].map(b => [names[b], A.filter(r => r[2] === b).length, A.filter(r => r[2] === b && REPL.has(r[0])).length]));
      subTable(el, L('Các văn bản căn cứ Hiến pháp năm 1992', 'The acts resting on the 1992 Constitution'), [L('Văn bản', 'Act'), L('Số hiệu', 'Number'), L('Thông qua', 'Adopted')], n92.map(r => [actName(r[0]), actNum(r[0]), dateShort(r[1])]), [0, 0, 1]);
    }
  };
});

// 12. the six codes and the Constitution
chart('c12', el => {
  const OR = ['Hiến pháp năm 2013', 'Bộ luật Dân sự', 'Bộ luật Hình sự', 'Bộ luật Tố tụng dân sự', 'Bộ luật Tố tụng hình sự', 'Bộ luật Lao động', 'Bộ luật Hàng hải'];
  const C12 = D.c12.slice().sort((a, b) => OR.indexOf(ACTS[a.i][0]) - OR.indexOf(ACTS[b.i][0]));
  const mv = d3.max(C12, r => r.versions), most = C12.filter(r => r.versions === mv), none = C12.filter(r => r.laws === 0);
  const blhs = C12.find(r => ACTS[r.i][0] === 'Bộ luật Hình sự'), s0 = blhs.steps[0];
  return {
    title: L(`${andL(none.map(r => actName(r.i)))} chưa được sửa lần nào; ${andL(most.map(r => actName(r.i)))} đã có ${fmt(mv)} phiên bản`,
      `${Cap(andL(theL(none.map(r => actName(r.i)))))} has never been amended; ${andL(theL(most.map(r => actName(r.i))))} have had ${fmt(mv)} versions each`),
    dek: L(`Hiến pháp năm 2013 và sáu bộ luật: số phiên bản, số luật đã sửa, số điều được sửa, bổ sung hoặc bãi bỏ, và tỷ lệ câu chữ hiện hành do luật sửa đổi viết; các cột nhỏ là các lần sửa theo thời gian, cao theo số điều. Luật ${s0[1]} sửa ${fmt(s0[2])} điều của Bộ luật Hình sự đúng vào ngày bộ luật có hiệu lực, ${dateTxt(s0[0])}.`,
      `The Constitution of 2013 and the six codes: versions, amending laws, articles rewritten, inserted or repealed, and the share of the wording in force written by amending laws; the small columns are the amendments over time, their height the articles changed. Law ${s0[1]} amended ${fmt(s0[2])} articles of the Penal Code on the very day the Code took effect, ${dateTxt(s0[0])}.`),
    draw(el) {
      const box = el.append('div').attr('class', 'cards'), cA = css('--s2');
      const sparks = C12.map(r => {
        const d = box.append('div').attr('class', 'card');
        d.append('div').attr('class', 'cn').text(actName(r.i));
        d.append('div').attr('class', 'cs').text(actNum(r.i) ? `${actNum(r.i)} · ${L('có hiệu lực', 'in force')} ${dateShort(r.inforce)}` : `${L('thông qua', 'adopted')} ${dateShort(r.enacted)} · ${L('có hiệu lực', 'in force')} ${dateShort(r.inforce)}`);
        d.append('div').attr('class', 'cv').html(`<b>${fmt(r.versions)}</b> ${L('phiên bản', r.versions === 1 ? 'version' : 'versions')}`);
        d.append('div').attr('class', 'cs').text(L(`${fmt(r.arts)} điều · ${fmt(r.words)} từ`, `${fmt(r.arts)} articles · ${fmt(r.words)} words`));
        const parts = [];
        if (r.modified) parts.push(L(`sửa ${fmt(r.modified)} điều`, `${fmt(r.modified)} rewritten`));
        if (r.inserted) parts.push(L(`bổ sung ${fmt(r.inserted)}`, `${fmt(r.inserted)} inserted`));
        if (r.removed) parts.push(L(`bãi bỏ ${fmt(r.removed)}`, `${fmt(r.removed)} repealed`));
        d.append('div').attr('class', 'cs').text(r.laws ? L(`${fmt(r.laws)} luật sửa đổi: `, `${fmt(r.laws)} amending law${r.laws === 1 ? '' : 's'}: `) + parts.join(', ') : L('chưa có luật sửa đổi', 'no amending law'));
        const bar = d.append('div').attr('class', 'cbar'); bar.append('i').style('width', (100 * r.amended_share) + '%').style('background', cA);
        d.append('div').attr('class', 'cs').text(L(`${pct(r.amended_share, 1, r.amended_share > 0 && r.amended_share < .01 ? 1 : 0)} câu chữ hiện hành do luật sửa đổi viết`, `${pct(r.amended_share, 1, r.amended_share > 0 && r.amended_share < .01 ? 1 : 0)} of the wording in force by amending laws`));
        return { r, d };
      });
      // the amendments over time, 2014-2026: drawn once every card has its width
      const ym = d3.max(C12, q => d3.max(q.steps, s => s[2]) || 0);
      sparks.forEach(({ r, d }) => {
        const sw = WR(d) - 28, sh = 38, svg = svgIn(d, sw, sh), x = d3.scaleTime().domain([new Date(2014, 0, 1), new Date(2027, 0, 1)]).range([4, sw - 4]);
        d.select('.plot').style('margin-top', '6px');
        const yy = d3.scaleSqrt().domain([0, ym]).range([0, sh - 14]);
        svg.append('line').attr('x1', 0).attr('x2', sw).attr('y1', sh - 12).attr('y2', sh - 12).attr('stroke', css('--line'));
        (sw < 200 ? [2014, 2020, 2026] : [2014, 2018, 2022, 2026]).forEach(y => svg.append('text').attr('class', 'lbl mut').style('font-size', '10px').attr('x', x(new Date(y, 0, 1))).attr('y', sh - 1).attr('text-anchor', y === 2014 ? 'start' : y === 2026 ? 'end' : 'middle').text(y));
        r.steps.forEach(s => {
          const cx = x(PD(s[0])), hh = Math.max(2, yy(s[2]));
          const bb = svg.append('path').attr('d', colPath(cx - 3, sh - 12, 6, sh - 12 - hh, 2)).attr('fill', cA).datum(s);
          bindTip(bb, q => `<b>${esc(actName(r.i))}</b>` + trow(null, L('Có hiệu lực', 'In force'), dateShort(q[0])) + trow(null, L('Luật sửa đổi', 'Amending law'), esc(lawFull(q[1]))) + trow(cA, L('Điều', 'Articles'), fmt(q[2])));
        });
        if (!r.steps.length) svg.append('text').attr('class', 'lbl mut').attr('x', sw / 2).attr('y', sh - 17).attr('text-anchor', 'middle').text(L('chưa sửa lần nào', 'never amended'));
      });
      note(el, ['bo-luat/2015/*', 'bo-luat/2019/45-2019-qh14', 'constitution/hien-phap', 'data/versions.json'], L(`7 văn bản, ${fmt(sum(C12, r => r.arts))} điều`, `7 acts, ${fmt(sum(C12, r => r.arts))} articles`),
        L('Bộ luật Dân sự: vbpl.vn không liệt kê văn bản sửa đổi và không có văn bản hợp nhất nào cho bộ luật này, nên hồ sơ giữ văn bản khi thông qua. Bộ luật Hình sự và Bộ luật Tố tụng hình sự mỗi bộ bỏ một chương (18 điều) từ ngày 1 tháng 1 năm 2026 (Luật Tư pháp người chưa thành niên).',
          'Civil Code: vbpl.vn lists no amending act and no consolidated text for it, so the record keeps the text as adopted. The Penal Code and the Criminal Procedure Code each lost one chapter (18 articles) from 1 January 2026 (Law on Juvenile Justice).'));
      table(el, [L('Văn bản', 'Act'), L('Phiên bản', 'Versions'), L('Luật sửa đổi', 'Amending laws'), L('Điều (khi thông qua)', 'Articles (as adopted)'), L('Điều (nay)', 'Articles (now)'), L('Điều được sửa', 'Rewritten'), L('Bổ sung', 'Inserted'), L('Bãi bỏ', 'Repealed'), L('Do luật sửa đổi viết', 'By amending laws')],
        C12.map(r => [actName(r.i), r.versions, r.laws, r.arts0, r.arts, r.modified, r.inserted, r.removed, pct(r.amended_share, 1, 1)]));
      subTable(el, L('Các lần sửa', 'The amendments'), [L('Văn bản', 'Act'), L('Có hiệu lực', 'In force'), L('Luật sửa đổi', 'Amending law'), L('Điều', 'Articles')], C12.flatMap(r => r.steps.map(s => [actName(r.i), dateShort(s[0]), lawFull(s[1]), s[2]])), [0, 0, 0, 1]);
    }
  };
});

const PCH = { XIII: ['An ninh quốc gia', 'National security'], XIV: ['Tính mạng, sức khỏe, nhân phẩm, danh dự', 'Life, health, dignity and honour'], XV: ['Quyền tự do, dân chủ', 'Freedom and democratic rights'],
  XVI: ['Sở hữu', 'Property'], XVII: ['Hôn nhân và gia đình', 'Marriage and family'], XVIII: ['Trật tự quản lý kinh tế', 'Economic management'], XIX: ['Môi trường', 'Environment'],
  XX: ['Ma túy', 'Narcotics'], XXI: ['An toàn, trật tự công cộng', 'Public safety and order'], XXII: ['Trật tự quản lý hành chính', 'Administrative order'], XXIII: ['Chức vụ', 'Abuse of office'],
  XXIV: ['Hoạt động tư pháp', 'Administration of justice'], XXV: ['Nghĩa vụ, trách nhiệm của quân nhân', 'Military duties'], XXVI: ['Hòa bình, loài người, chiến tranh', 'Peace, humanity and war'] };
const PEN = () => [L('Không phạt tù', 'No prison'), L('Tù đến 3 năm', 'Up to 3 years'), L('Đến 7 năm', 'Up to 7 years'), L('Đến 15 năm', 'Up to 15 years'), L('Đến 20 năm', 'Up to 20 years'), L('Trên 20 năm', 'Over 20 years'), L('Tù chung thân', 'Life'), L('Tử hình', 'Death')];

// 13. the Penal Code: the highest penalty of each crime, by chapter
chart('c13', el => {
  const c = D.c13, R = c.rows, tot = d3.range(8).map(k => sum(R, r => r[1][k])), heavy = tot[6] + tot[7];
  const share = r => (r[1][6] + r[1][7]) / sum(r[1]), top = R.slice().sort((a, b) => share(b) - share(a));
  const PEN_EN = { XIII: 'crimes against national security', XIV: 'crimes against life, health, dignity and honour', XV: 'crimes against freedom and democratic rights', XVI: 'crimes against property',
    XVII: 'crimes against marriage and the family', XVIII: 'crimes against economic management', XIX: 'environmental crimes', XX: 'drug crimes', XXI: 'crimes against public safety and order',
    XXII: 'crimes against administrative order', XXIII: 'crimes of office', XXIV: 'crimes against the administration of justice', XXV: 'crimes against military duties', XXVI: 'crimes against peace and humanity, and war crimes' };
  const chLong = ch => L((c.chapters[ch] || '').toLowerCase(), PEN_EN[ch]);
  const top3 = top.slice(0, 3).map(r => `${chLong(r[0])} (${L('chương', 'chapter')} ${r[0]}, ${pct(r[1][6] + r[1][7], sum(r[1]))})`);
  return {
    title: L(`Bộ luật Hình sự: ${fmt(heavy)} trong ${fmt(c.n)} tội có mức hình phạt cao nhất là tù chung thân hoặc tử hình`, `The Penal Code: ${fmt(heavy)} of its ${fmt(c.n)} crimes carry life imprisonment or death at most`),
    dek: L(`Hình phạt cao nhất mà mỗi điều về một tội quy định cho người phạm tội, theo chương của Phần thứ hai, theo văn bản đang có hiệu lực. ${fmt(tot[3])} tội có mức cao nhất là tù đến 15 năm, nhóm đông nhất. Tỷ lệ tù chung thân và tử hình cao nhất ở ${top3[0]}, ${top3[1]} và ${top3[2]}.`,
      `The highest penalty each article on a crime sets for a natural person, by chapter of Part Two, in the text in force. ${fmt(tot[3])} crimes carry up to 15 years at most, the largest group. Life imprisonment and death are most common among ${top3[0]}, ${top3[1]} and ${top3[2]}.`),
    draw(el) {
      const ramp = seqRamp(), keys = [0, 1, 2, 3, 4, 6, 7], colors = [ramp(.1), ramp(.28), ramp(.46), ramp(.64), ramp(.82), css('--s2'), css('--s8')], names = keys.map(k => PEN()[k]);
      legend(el, names.map((l, i) => ({ c: colors[i], l })));
      const rows = R.map(r => { const o = { ch: r[0] }; keys.forEach(k => o[k] = r[1][k]); return o; });
      bands(el, rows, keys, colors, names, { rowH: 30, label: (r, nw) => nw ? `${r.ch}` : `${r.ch} · ${LA(PCH[r.ch])}`, lcap: 44, right: r => L(`${fmt(sum(keys, k => r[k]))} tội`, `${fmt(sum(keys, k => r[k]))} crimes`),
        tipHead: d => `<div class="q">${esc(c.chapters[d.ch] ? Cap(c.chapters[d.ch].toLowerCase()) : '')}</div>` });
      note(el, ['bo-luat/2015/100-2015-qh13/art-*.md', 'bo-luat/2015/100-2015-qh13/cau-truc.md'], L(`${fmt(c.n)} điều về tội phạm (tiêu đề bắt đầu bằng “Tội”), Điều 108 đến Điều 425`, `${fmt(c.n)} articles on a crime (headed “Tội…”), Articles 108 to 425`),
        L('mức cao nhất đọc từ các khoản của điều: “tử hình”, “tù chung thân”, rồi số năm tù lớn nhất (“phạt tù từ … đến N năm”); hình phạt dành cho pháp nhân thương mại không được tính. Ranh giới các chương lấy theo tội đầu tiên của mỗi chương (kiểm tra trong src/prep.py).',
          'the highest penalty is read from the clauses of the article: “tử hình” (death), “tù chung thân” (life), then the longest prison term (“phạt tù từ … đến N năm”); penalties for commercial legal entities are not counted. Chapter boundaries follow the first crime of each chapter (checked in src/prep.py).'));
      table(el, [L('Chương', 'Chapter'), ...names, t('total')], R.map(r => [`${r[0]} · ${LA(PCH[r[0]])}`, ...keys.map(k => r[1][k]), sum(r[1])]).concat([[t('total'), ...keys.map(k => tot[k]), sum(tot)]]));
    }
  };
});

// 14. the death penalty, crime by crime
chart('c14', el => {
  const c = D.c14, kept = c.crimes.filter(r => r[3]), gone = c.crimes.filter(r => !r[3]);
  const CR = { 108: 'High treason', 109: 'Activities aimed at overthrowing the people’s government', 110: 'Espionage', 112: 'Rebellion', 113: 'Terrorism against the people’s government',
    114: 'Sabotage of the material and technical facilities of the State', 123: 'Murder', 142: 'Rape of a person under 16', 194: 'Making or trading fake medicines',
    248: 'Illegal production of narcotics', 250: 'Illegal transport of narcotics', 251: 'Illegal trading in narcotics', 299: 'Terrorism', 353: 'Embezzlement', 354: 'Taking bribes',
    421: 'Undermining peace, waging a war of aggression', 422: 'Crimes against humanity', 423: 'War crimes' };
  const crName = r => LANG === 'vi' ? r[2].replace(/ của nước Cộng hòa xã hội chủ nghĩa Việt Nam$/, '') : (CR[r[0]] || r[2]);
  const ex = gone.filter(r => [353, 354, 250].includes(r[0])).map(r => { const s = crName(r); return LANG === 'vi' ? s.charAt(0).toLowerCase() + s.slice(1) : s.charAt(0).toLowerCase() + s.slice(1); });
  return {
    title: L(`Tử hình: từ ${fmt(c.crimes.length)} tội còn ${fmt(kept.length)} tội kể từ ngày ${dateTxt(c.day)}`, `The death penalty: from ${fmt(c.crimes.length)} crimes to ${fmt(kept.length)} since ${dateTxt(c.day)}`),
    dek: L(`Các tội mà Bộ luật Hình sự quy định hình phạt tử hình khi có hiệu lực ngày 1 tháng 1 năm 2018. Luật ${c.law}, thông qua ngày ${dateTxt(c.enacted)}, bỏ hình phạt tử hình ở ${fmt(gone.length)} tội, trong đó có ${ex.join(', ').replace(/, ([^,]*)$/, ' và $1')}; mức cao nhất của các tội này nay là tù chung thân. Số tội có mức cao nhất là tù chung thân tăng từ ${fmt(c.life_before)} lên ${fmt(c.life_now)}.`,
      `The crimes for which the Penal Code set the death penalty when it took effect on 1 January 2018. Law ${c.law}, adopted on ${dateTxt(c.enacted)}, removed the death penalty for ${fmt(gone.length)} of them, among them ${ex.join(', ').replace(/, ([^,]*)$/, ' and $1')}; their highest penalty is now life imprisonment. The crimes whose highest penalty is life imprisonment rose from ${fmt(c.life_before)} to ${fmt(c.life_now)}.`),
    draw(el) {
      const cK = css('--s8'), cG = css('--muted-mark');
      const k = el.append('div').attr('class', 'ptiles three');
      [[fmt(c.crimes.length), L('tội có hình phạt tử hình ngày 1/1/2018', 'crimes punishable by death on 1 Jan 2018'), cK, c.crimes.length],
       [fmt(kept.length), L(`tội có hình phạt tử hình từ ${dateShort(c.day)}`, `crimes punishable by death from ${dateShort(c.day)}`), cK, kept.length],
       [fmt(gone.length), L('tội nay cao nhất là tù chung thân', 'crimes now carrying life at most'), cG, gone.length]].forEach(([v, l, col, n]) => {
        const t_ = k.append('div').attr('class', 'ptile'); t_.append('div').attr('class', 'pv').html(`<b>${v}</b>`); t_.append('div').attr('class', 'ps').text(l);
        const bar = t_.append('div').attr('class', 'pbar'); bar.append('i').style('flex', n).style('background', col); if (n < c.crimes.length) bar.append('i').style('flex', c.crimes.length - n).style('background', css('--line'));
      });
      legend(el, [{ c: cK, l: L('Vẫn có hình phạt tử hình', 'Still punishable by death') }, { c: cG, l: L(`Bỏ tử hình từ ${dateShort(c.day)}`, `Death penalty removed from ${dateShort(c.day)}`) }]);
      const box = el.append('div').attr('class', 'crimes');
      c.crimes.forEach(r => {
        const d = box.append('div').attr('class', 'crime' + (r[3] ? ' kept' : ' gone')).style('--cc', r[3] ? cK : cG);
        d.append('div').attr('class', 'ca').text(L(`Chương ${r[1]} · Điều ${r[0]}`, `Chapter ${r[1]} · Article ${r[0]}`));
        d.append('div').attr('class', 'ct').text(crName(r));
        const x = d.append('div').attr('class', 'cx');
        if (r[3]) x.append('span').attr('class', 'chip').style('background', cK).style('color', '#fff').text(L('tử hình', 'death penalty'));
        else { x.append('span').attr('class', 'chip strike').text(L('tử hình', 'death penalty')); x.append('span').text(L(`→ tù chung thân từ ${dateShort(c.day)}`, `→ life imprisonment from ${dateShort(c.day)}`)); }
      });
      note(el, ['bo-luat/2015/100-2015-qh13/art-*.md', 'git log -- bo-luat/2015/100-2015-qh13'], L(`${fmt(c.crimes.length)} tội có hình phạt tử hình trong văn bản có hiệu lực ngày 1/1/2018`, `${fmt(c.crimes.length)} crimes punishable by death in the text in force on 1 Jan 2018`),
        L('một tội có hình phạt tử hình khi một khoản của điều quy định “… hoặc tử hình”; Điều 387 chỉ nhắc đến người bị kết án tử hình và không được tính. Hồ sơ không có số liệu về các bản án.',
          'a crime is punishable by death when a clause of its article reads “… hoặc tử hình” (or death); Article 387 only mentions persons sentenced to death and is not counted. The record holds no figures on sentences.'));
      table(el, [L('Điều', 'Article'), L('Tội', 'Crime'), L('Chương', 'Chapter'), L('Nay', 'Now')], c.crimes.map(r => [r[0], crName(r), r[1], r[3] ? L('tử hình', 'death') : L('tù chung thân', 'life')]));
    }
  };
});

part('p4', 'IV. Năm 2025: sắp xếp lại bộ máy', 'IV. 2025: reorganising the state',
  'Năm 2025, Hiến pháp sửa đổi tổ chức đơn vị hành chính thành hai cấp (Điều 110), và hàng chục văn bản được sửa trong cùng một ngày. Ba biểu đồ về những ngày thay đổi và những tên gọi cũ còn lại trong văn bản.',
  'In 2025 the amended Constitution organised administrative units in two levels (Article 110), and dozens of acts were amended on a single day. Three charts on the days of change and the old names still in the text.');

// 15. the days that changed most of the record
chart('c15', el => {
  const c = D.c15, d1 = c.by_day[c.days[0]], cnt = (d, s) => d.status.filter(x => x === s).length;
  const n1 = cnt(d1, 'new'), a1 = cnt(d1, 'amended'), active1 = d1.status.filter(x => x !== 'later' && x !== 'replaced').length, d2 = c.by_day[c.days[1]];
  return {
    title: L(`Ngày ${dateTxt(c.days[0])}: ${fmt(n1 + a1)} văn bản được sửa hoặc bắt đầu có hiệu lực trong một ngày`, `${dateTxt(c.days[0])}: ${fmt(n1 + a1)} acts amended or taking effect on a single day`),
    dek: L(`Mỗi ô là một trong ${fmt(PF.acts)} văn bản của hồ sơ, nhóm theo lĩnh vực, vào ba ngày có nhiều thay đổi nhất. Ngày ${dateTxt(c.days[0])}, ${fmt(a1)} văn bản được sửa và ${fmt(n1)} văn bản bắt đầu có hiệu lực, ${pct(n1 + a1, active1)} số văn bản đang có hiệu lực; ${fmt(d1.laws)} luật sửa ${fmt(d1.arts)} điều. Ngày ${dateTxt(c.days[1])}, ${fmt(cnt(d2, 'amended'))} văn bản được sửa (${fmt(d2.arts)} điều).`,
      `Each square is one of the ${fmt(PF.acts)} acts of the record, by field, on the three days with the most change. On ${dateTxt(c.days[0])}, ${fmt(a1)} acts were amended and ${fmt(n1)} took effect, ${pct(n1 + a1, active1)} of the acts in force; ${fmt(d1.laws)} laws changed ${fmt(d1.arts)} articles. On ${dateTxt(c.days[1])}, ${fmt(cnt(d2, 'amended'))} acts were amended (${fmt(d2.arts)} articles).`),
    draw(el) {
      const ST = { new: [L('Bắt đầu có hiệu lực', 'Took effect'), css('--s3')], amended: [L('Được sửa', 'Amended'), css('--s2')], same: [L('Không đổi', 'Unchanged'), css('--muted-mark')],
        later: [L('Chưa có hiệu lực', 'Not yet in force'), 'none'], replaced: [L('Đã được thay thế', 'Replaced'), 'hatch'] };
      legend(el, Object.entries(ST).map(([k, [l, c]]) => ({ c: c === 'none' || c === 'hatch' ? '' : c, l, shape: c === 'none' ? 'outline' : c === 'hatch' ? 'hatch' : '' })));
      const w = W(el), nw = narrow(w), byF = FIELDS.map(f => ({ f, idx: c.fields.map((x, i) => x === f ? i : -1).filter(i => i >= 0) }));
      const maxN = d3.max(byF, r => r.idx.length), lw = nw ? 0 : Math.ceil(textW(el, FIELDS.map(f => fieldName(f, true)))) + 10;
      const panes = nw ? 1 : 3, gapP = 18, pw = (w - lw - gapP * (panes - 1)) / panes;
      const cols = nw ? Math.min(maxN, Math.floor((w - 4) / 14)) : Math.ceil(maxN / 2), cs = Math.min(nw ? 14 : 19, pw / cols), rowsPer = r => Math.ceil(r.idx.length / cols);
      const SO = { new: 0, amended: 1, same: 2, later: 3, replaced: 4 };
      const fieldH = r => rowsPer(r) * cs + (nw ? 16 : 8);
      const panelH = sum(byF, fieldH) + 26;
      const draw1 = (svg, ox, oy, day, withLabels) => {
        const d = c.by_day[day], g = svg.append('g').attr('transform', `translate(${ox},${oy})`), hp = hatch(svg);
        g.append('text').attr('class', 'lbl big').attr('x', 0).attr('y', 12).text(dateShort(day));
        g.append('text').attr('class', 'lbl').attr('x', textW(el, [dateShort(day)], 'lbl big') + 8).attr('y', 12).text(L(`${cnt(d, 'amended')} được sửa · ${cnt(d, 'new')} mới`, `${cnt(d, 'amended')} amended · ${cnt(d, 'new')} new`));
        let yy = 24;
        byF.forEach(r => {
          if (nw) { g.append('text').attr('class', 'lbl mut').attr('x', 0).attr('y', yy + 10).text(fieldName(r.f, true)); yy += 14; }
          else if (withLabels) svg.append('text').attr('class', 'lbl strong').attr('x', lw - 8).attr('y', oy + yy + (rowsPer(r) * cs) / 2 + 4).attr('text-anchor', 'end').text(fieldName(r.f, true));
          r.idx.slice().sort((a, b) => SO[d.status[a]] - SO[d.status[b]] || a - b).forEach((i, k) => {
            const s = d.status[i], col = ST[s][1], x0 = (k % cols) * cs, y0 = yy + Math.floor(k / cols) * cs;
            const q = g.append('rect').attr('x', x0 + 1.5).attr('y', y0 + 1.5).attr('width', cs - 3).attr('height', cs - 3).attr('rx', 3)
              .attr('fill', col === 'none' ? 'none' : col === 'hatch' ? hp : col).attr('stroke', col === 'none' ? css('--text-3') : null).attr('stroke-dasharray', col === 'none' ? '2 1.5' : null).attr('stroke-width', col === 'none' ? 1 : null).datum({ i, s });
            bindTip(q, z => `<b>${esc(actName(z.i))}</b><div class="q">${esc(actNum(z.i))}</div>` + trow(ST[z.s][1] === 'none' || ST[z.s][1] === 'hatch' ? null : ST[z.s][1], dateShort(day), ST[z.s][0]));
          });
          yy += rowsPer(r) * cs + (nw ? 2 : 8);
        });
      };
      if (nw) c.days.forEach(day => { const svg = svgIn(el, w, panelH + 4); draw1(svg, 2, 2, day, false); });
      else { const svg = svgIn(el, w, panelH + 4); c.days.forEach((day, i) => draw1(svg, lw + i * (pw + gapP), 2, day, i === 0)); }
      note(el, ['git log (In-force)', 'art-*.md'], L(`${fmt(PF.acts)} văn bản, 3 ngày`, `${fmt(PF.acts)} acts, 3 days`),
        L('một văn bản “được sửa” khi ít nhất một điều của nó thay đổi trong ngày đó; văn bản có hiệu lực và được sửa cùng ngày tính là “bắt đầu có hiệu lực”. Văn bản đã được một văn bản sau trong hồ sơ thay thế được gạch chéo.',
          'an act is “amended” when at least one of its articles changes that day; an act that took effect and was amended on the same day counts as “took effect”. Acts replaced by a later act of the record are hatched.'));
      table(el, [L('Ngày', 'Day'), L('Được sửa', 'Amended'), L('Bắt đầu có hiệu lực', 'Took effect'), L('Không đổi', 'Unchanged'), L('Chưa có hiệu lực', 'Not yet in force'), L('Đã được thay thế', 'Replaced'), L('Luật sửa đổi', 'Amending laws'), L('Điều thay đổi', 'Articles changed')],
        c.days.map(day => { const d = c.by_day[day]; return [dateShort(day), cnt(d, 'amended'), cnt(d, 'new'), cnt(d, 'same'), cnt(d, 'later'), cnt(d, 'replaced'), d.laws, d.arts]; }));
    }
  };
});

// 16. "cấp huyện" in the law in force
chart('c16', el => {
  const S0 = D.c16.series, peak = S0.reduce((a, r) => r[1] > a[1] ? r : a), last = S0[S0.length - 1], amendDay = D.c16.amend_day;
  const pre = S0.filter(r => r[0] < '2025-07-01').pop();
  return {
    title: L(`“Cấp huyện” vẫn còn trong ${fmt(last[1])} điều luật của hồ sơ, giảm từ ${fmt(peak[1])} điều năm 2025`, `“District level” is still written in ${fmt(last[1])} articles of the record, down from ${fmt(peak[1])} in 2025`),
    dek: L(`Số điều đang có hiệu lực trong hồ sơ có cụm từ “cấp huyện”, sau mỗi ngày có văn bản thay đổi. Hiến pháp sửa đổi năm 2025 (Điều 110) tổ chức đơn vị hành chính thành hai cấp: tỉnh và dưới tỉnh. Từ ngày 1 tháng 7 năm 2025, số điều có cụm từ này giảm ${fmt(pre[1] - last[1])}, nhưng ${fmt(D.c16.acts_huyen_now)} văn bản vẫn còn cụm từ. Đường nét đứt là “cấp xã”, nay có trong ${fmt(last[2])} điều.`,
      `The articles in force in the record that contain the phrase “cấp huyện” (district level), after each day an act changed. The Constitution as amended in 2025 (Article 110) organises administrative units in two levels: the province and the units below it. From 1 July 2025 the articles holding the phrase fell by ${fmt(pre[1] - last[1])}, but ${fmt(D.c16.acts_huyen_now)} acts still hold it. The dashed line is “cấp xã” (commune level), now in ${fmt(last[2])} articles.`),
    draw(el) {
      const cH = css('--s2'), cX = css('--s1');
      legend(el, [{ c: cH, l: L('Điều có “cấp huyện”', 'Articles with “cấp huyện” (district level)'), shape: 'line' }, { c: cX, l: L('Điều có “cấp xã”', 'Articles with “cấp xã” (commune level)'), shape: 'dash' }]);
      const w = W(el), nw = narrow(w), h = nw ? 280 : 330, m = { t: 26, r: nw ? 40 : 70, b: 26, l: 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleTime().domain([new Date(2014, 0, 1), new Date(2026, 11, 31)]).range([0, iw]), y = d3.scaleLinear().domain([0, d3.max(S0, r => Math.max(r[1], r[2]))]).nice().range([ih, 0]);
      yAxis(g, y, iw, 5);
      d3.range(2014, 2027, nw ? 3 : 2).forEach(yy => g.append('text').attr('class', 'lbl mut').attr('x', x(new Date(yy, 0, 1))).attr('y', ih + 16).attr('text-anchor', 'middle').text(yy));
      const xa = x(PD(amendDay));
      g.append('line').attr('x1', xa).attr('x2', xa).attr('y1', -10).attr('y2', ih).attr('stroke', css('--text-3')).attr('stroke-dasharray', '3 3');
      halo(g, xa - 6, -14, L('Hiến pháp sửa đổi 2025', 'Constitution amended 2025'), 'end', 'lbl mut');
      const stepPts = k => { const p = []; S0.forEach((r, i) => { if (i) p.push([PD(r[0]), S0[i - 1][k]]); p.push([PD(r[0]), r[k]]); }); p.push([PD(PF.retrieved), S0[S0.length - 1][k]]); return p; };
      const pH = stepPts(1), pX = stepPts(2);
      // the gap between the two series, shaded
      g.append('path').attr('d', d3.area().x(p => x(p[0])).y0((p, i) => y(pX[i][1])).y1(p => y(p[1]))(pH)).attr('fill', cX).attr('fill-opacity', .07);
      g.append('path').attr('d', d3.area().x(p => x(p[0])).y0(ih).y1(p => y(p[1]))(pH)).attr('fill', grad(svg, 'c16g', cH, .28));
      g.append('path').attr('d', d3.line().x(p => x(p[0])).y(p => y(p[1]))(pX)).attr('fill', 'none').attr('stroke', cX).attr('stroke-width', 1.8).attr('stroke-dasharray', '5 4');
      g.append('path').attr('d', d3.line().x(p => x(p[0])).y(p => y(p[1]))(pH)).attr('fill', 'none').attr('stroke', cH).attr('stroke-width', 2.4);
      const changes = S0.filter((r, i) => !i || r[1] !== S0[i - 1][1]);
      changes.forEach(r => g.append('circle').attr('cx', x(PD(r[0]))).attr('cy', y(r[1])).attr('r', 2.6).attr('fill', cH).attr('stroke', css('--surface')).attr('stroke-width', 1));
      // labels: first, peak, last of each
      g.append('circle').attr('cx', x(PD(peak[0]))).attr('cy', y(peak[1])).attr('r', 4).attr('fill', cH).attr('stroke', css('--surface')).attr('stroke-width', 1.5);
      const xaAt = S0.filter(r => r[0] <= peak[0]).pop()[2], ylab = y(Math.max(peak[1], xaAt)) - 9;
      halo(g, x(PD(peak[0])) - 6, ylab, L(`${fmt(peak[1])} điều (${dateShort(peak[0])})`, `${fmt(peak[1])} (${dateShort(peak[0])})`), 'end', 'lbl strong', cH);
      const xl = x(PD(PF.retrieved));
      halo(g, xl + 5, y(last[1]) + 4, fmt(last[1]), 'start', 'lbl strong', cH);
      halo(g, xl + 5, y(last[2]) + 4, fmt(last[2]), 'start', 'lbl strong', cX);
      bindTip(g.selectAll('.hit').data(S0).join('rect').attr('class', 'hit').attr('x', (r, i) => x(PD(r[0]))).attr('width', (r, i) => Math.max(2, (i < S0.length - 1 ? x(PD(S0[i + 1][0])) : xl) - x(PD(r[0])))).attr('y', 0).attr('height', ih),
        r => `<b>${L('Từ ngày', 'From')} ${dateShort(r[0])}</b>` + trow(cH, L('Điều có “cấp huyện”', 'Articles with “cấp huyện”'), fmt(r[1])) + trow(null, L('Số lần xuất hiện', 'Occurrences'), fmt(r[4])) + trow(cX, L('Điều có “cấp xã”', 'Articles with “cấp xã”'), fmt(r[2])) + trow(null, L('Điều có “Tòa án nhân dân khu vực”', 'Articles with “Tòa án nhân dân khu vực”'), fmt(r[3])));
      note(el, ['art-*.md', 'git log (In-force)'], L(`${fmt(S0.length)} ngày thay đổi từ 2014`, `${fmt(S0.length)} days of change since 2014`),
        L(`đếm các điều có cụm từ, không phân biệt chữ hoa; mỗi văn bản được tính từ ngày có hiệu lực. ${fmt(PF.replaced.length)} văn bản đã được một văn bản sau trong hồ sơ thay thế không còn được tính từ ngày văn bản sau có hiệu lực; văn bản bị một luật ngoài hồ sơ thay thế vẫn được tính. Từ ngày 1 tháng 7 năm 2025, “Tòa án nhân dân khu vực” xuất hiện trong ${fmt(last[3])} điều.`,
          `articles containing the phrase, in any case; each act counts from its day in force. The ${fmt(PF.replaced.length)} acts replaced by a later act of the record stop counting on the day the later act took effect; an act replaced by a law outside the record still counts. From 1 July 2025, “Tòa án nhân dân khu vực” (regional people’s court) appears in ${fmt(last[3])} articles.`));
      table(el, [L('Từ ngày', 'From'), L('“cấp huyện” (điều)', '“cấp huyện” (articles)'), L('“cấp xã” (điều)', '“cấp xã” (articles)'), L('“Tòa án nhân dân khu vực” (điều)', '“Tòa án nhân dân khu vực” (articles)')], S0.map(r => [dateShort(r[0]), r[1], r[2], r[3]]).reverse());
    }
  };
});

// 17. the ministries named in the law in force
chart('c17', el => {
  const c = D.c17, K = c.keys, S0 = c.series, last = S0[S0.length - 1], idx = k => K.indexOf(k) + 1;
  const MIN = { MONRE: ['Bộ Tài nguyên và Môi trường', 'Ministry of Natural Resources and Environment'], MARD: ['Bộ Nông nghiệp và Phát triển nông thôn', 'Ministry of Agriculture and Rural Development'],
    MOT: ['Bộ Giao thông vận tải', 'Ministry of Transport'], MPI: ['Bộ Kế hoạch và Đầu tư', 'Ministry of Planning and Investment'],
    MOLISA: ['Bộ Lao động - Thương binh và Xã hội', 'Ministry of Labour, Invalids and Social Affairs'], MIC: ['Bộ Thông tin và Truyền thông', 'Ministry of Information and Communications'],
    MAE: ['Bộ Nông nghiệp và Môi trường', 'Ministry of Agriculture and Environment'] };
  const old = ['MONRE', 'MARD', 'MOT', 'MPI', 'MOLISA', 'MIC'], peak = k => d3.max(S0, r => r[idx(k)]);
  const sw = D.c20.swaps, swN = k => (sw.find(s => s[0] === k) || [0, 0, 0, 0, 0, 0])[5];
  const most = old.slice().sort((a, b) => last[idx(b)] - last[idx(a)])[0];
  return {
    title: L(`“${MIN[most][0]}” vẫn có trong ${fmt(last[idx(most)])} điều; “${MIN.MONRE[0]}” chỉ còn trong ${fmt(last[idx('MONRE')])} điều`, `The ${MIN[most][1]} is still named in ${fmt(last[idx(most)])} articles; the ${MIN.MONRE[1]} in only ${fmt(last[idx('MONRE')])}`),
    dek: L(`Số điều đang có hiệu lực nêu tên sáu bộ mà các luật sửa đổi từ năm 2025 đã thay bằng tên bộ khác ở một số điều. Từ ngày 1 tháng 1 năm 2026, “${MIN.MAE[0]}” thay cho “${MIN.MONRE[0]}” và “${MIN.MARD[0]}”, và nay có trong ${fmt(last[idx('MAE')])} điều. “${MIN.MOT[0]}” được thay bằng “Bộ Xây dựng” ở ${fmt(swN('MOT'))} điều và “${MIN.MPI[0]}” bằng “Bộ Tài chính” ở ${fmt(swN('MPI'))} điều; tên “${MIN.MOLISA[0]}” chỉ được thay ở ${fmt(swN('MOLISA'))} điều.`,
      `The articles in force that name six ministries whose names amending laws since 2025 have replaced with another ministry’s in some articles. From 1 January 2026 the ${MIN.MAE[1]} takes the place of the Ministries of Natural Resources and Environment and of Agriculture and Rural Development, and is now named in ${fmt(last[idx('MAE')])} articles. The Ministry of Transport gave way to the Ministry of Construction in ${fmt(swN('MOT'))} articles and the Ministry of Planning and Investment to the Ministry of Finance in ${fmt(swN('MPI'))}; the ${MIN.MOLISA[1]} was replaced in only ${fmt(swN('MOLISA'))}.`),
    draw(el) {
      const box = el.append('div').attr('class', 'multi'), cO = css('--s2'), cN = css('--s3');
      const ymax = d3.max(S0, r => d3.max(old, k => r[idx(k)]));
      const panes = old.concat(['MAE']).map(k => ({ k, p: box.append('div') }));
      panes.forEach(({ k, p }) => {
        const isNew = k === 'MAE', col = isNew ? cN : cO, lv = last[idx(k)];
        p.append('h4').style('min-height', '2.8em').text(LA(MIN[k]));
        p.append('p').html(isNew ? L(`<b>${fmt(lv)}</b> điều, từ ${dateShort('2026-01-01')}`, `<b>${fmt(lv)}</b> articles, from ${dateShort('2026-01-01')}`) : L(`<b>${fmt(lv)}</b> điều, cao nhất ${fmt(peak(k))}`, `<b>${fmt(lv)}</b> articles, at most ${fmt(peak(k))}`));
        const w = WR(p), h = 96, m = { t: 6, r: 6, b: 16, l: 28 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b;
        const x = d3.scaleTime().domain([new Date(2014, 0, 1), PD(PF.retrieved)]).range([0, iw]), y = d3.scaleLinear().domain([0, isNew ? d3.max(S0, r => r[idx(k)]) : ymax]).nice().range([ih, 0]);
        yAxis(g, y, iw, 2);
        [2014, 2020, 2026].forEach(yy => g.append('text').attr('class', 'lbl mut').style('font-size', '10px').attr('x', x(new Date(yy, 0, 1))).attr('y', ih + 13).attr('text-anchor', yy === 2014 ? 'start' : yy === 2026 ? 'end' : 'middle').text(yy));
        const xa = x(new Date(2025, 6, 1));
        g.append('line').attr('x1', xa).attr('x2', xa).attr('y1', 0).attr('y2', ih).attr('stroke', css('--text-3')).attr('stroke-dasharray', '2 3');
        const pts = []; S0.forEach((r, i) => { if (i) pts.push([PD(r[0]), S0[i - 1][idx(k)]]); pts.push([PD(r[0]), r[idx(k)]]); }); pts.push([PD(PF.retrieved), lv]);
        const first = pts.findIndex(q => q[1] > 0), P = first > 0 ? pts.slice(first) : pts;   // no line at zero before the name appears
        g.append('path').attr('d', d3.area().x(q => x(q[0])).y0(ih).y1(q => y(q[1]))(P)).attr('fill', grad(svg, 'c17' + k, col, .25));
        g.append('path').attr('d', d3.line().x(q => x(q[0])).y(q => y(q[1]))(P)).attr('fill', 'none').attr('stroke', col).attr('stroke-width', 2);
        g.append('circle').attr('cx', x(PD(PF.retrieved))).attr('cy', y(lv)).attr('r', 3.2).attr('fill', col);
        bindTip(g.append('rect').attr('class', 'hit').attr('width', iw).attr('height', ih).datum(k), kk => `<b>${esc(LA(MIN[kk]))}</b>` + S0.filter(r => r[0] >= '2024-01-01').map(r => trow(null, dateShort(r[0]), fmt(r[idx(kk)]))).filter((s, i, a) => !i || s !== a[i - 1]).slice(-9).join(''));
      });
      note(el, ['art-*.md', 'git log (In-force)'], L(`7 tên bộ, ${fmt(S0.length)} ngày thay đổi`, `7 ministry names, ${fmt(S0.length)} days of change`),
        L('đếm các điều có đúng tên bộ (với “Bộ Lao động - Thương binh và Xã hội”, dấu gạch ngang, gạch dài hoặc dấu phẩy); đường chấm là ngày 1 tháng 7 năm 2025. Số điều được thay tên đọc từ các thay đổi trong biểu đồ 20. Văn bản đã được văn bản sau trong hồ sơ thay thế không còn được tính.',
          'articles containing the exact name (for the Ministry of Labour, Invalids and Social Affairs, with a hyphen, a dash or a comma); the dotted line is 1 July 2025. The number of articles renamed is read from the changes in chart 20. Acts replaced by a later act of the record stop counting.'));
      table(el, [L('Từ ngày', 'From'), ...K.map(k => LA(MIN[k]))], S0.filter(r => r[0] >= '2024-01-01').map(r => [dateShort(r[0]), ...K.map((k, i) => r[i + 1])]).reverse());
    }
  };
});

part('p5', 'V. Câu chữ của luật', 'V. The wording of the law',
  'Điều luật ngày càng dài và giao ngày càng nhiều việc cho Chính phủ; phần lớn các lần sửa một điều chỉ thay vài chữ.',
  'Articles grow longer and leave more to the Government; most changes to an article replace only a few words.');

const TROWS = () => Object.entries(D.c18).filter(([q]) => q !== 'QH16');

// 18. the length of articles as adopted, by term
chart('c18', el => {
  const R = TROWS(), a11 = D.c18.QH11, a15 = D.c18.QH15, long = r => (r.bins[3] + r.bins[4]) / r.arts;
  return {
    title: L(`Điều luật dài gấp đôi: trung vị ${fmt(a15.median)} từ ở các văn bản khóa XV, ${fmt(a11.median)} từ ở khóa XI`, `Articles have doubled in length: a median of ${fmt(a15.median)} words in the acts of the 15th National Assembly, ${fmt(a11.median)} in the 11th`),
    dek: L(`Độ dài các điều khi văn bản được thông qua, theo khóa Quốc hội đã thông qua. Ở khóa XV, ${pct(long(a15), 1)} số điều dài từ 400 từ trở lên; ở khóa XI là ${pct(long(a11), 1)}. Bên phải là trung vị số từ của một điều.`,
      `The length of articles when their act was adopted, by the term of the National Assembly that adopted it. In the 15th term, ${pct(long(a15), 1)} of articles run to 400 words or more; in the 11th, ${pct(long(a11), 1)}. On the right, the median words of an article.`),
    draw(el) {
      const ramp = seqRamp(), colors = [.12, .3, .5, .72, .95].map(v => ramp(v));
      const names = [L('dưới 100 từ', 'under 100 words'), L('100–199 từ', '100–199 words'), L('200–399 từ', '200–399 words'), L('400–799 từ', '400–799 words'), L('800 từ trở lên', '800 words or more')];
      legend(el, names.map((l, i) => ({ c: colors[i], l })));
      const rows = R.map(([q, v]) => ({ q, v, 0: v.bins[0], 1: v.bins[1], 2: v.bins[2], 3: v.bins[3], 4: v.bins[4] }));
      bands(el, rows, [0, 1, 2, 3, 4], colors, names, { rowH: 36, label: (r, nw) => nw ? ROM[r.q] : `${termShort(r.q)} · ${termYears(r.q)}`, lcap: 46, right: (r, nw) => nw ? fmt(r.v.median) : L(`${fmt(r.v.median)} từ`, `${fmt(r.v.median)} words`),
        tipHead: d => `<div class="q">${L(`${fmt(d.v.acts)} văn bản, ${fmt(d.v.arts)} điều`, `${fmt(d.v.acts)} acts, ${fmt(d.v.arts)} articles`)}</div>`, tipExtra: d => trow(null, L('Trung vị', 'Median'), L(`${fmt(d.v.median)} từ`, `${fmt(d.v.median)} words`)) + trow(null, L('Trung bình', 'Mean'), L(`${fmt(Math.round(d.v.mean))} từ`, `${fmt(Math.round(d.v.mean))} words`)) });
      note(el, ['<KIND>/<YEAR>/<NUMBER>/art-*.md (first version)'], L(`${fmt(sum(R, ([q, v]) => v.arts))} điều của ${fmt(sum(R, ([q, v]) => v.acts))} văn bản`, `${fmt(sum(R, ([q, v]) => v.arts))} articles of ${fmt(sum(R, ([q, v]) => v.acts))} acts`),
        L('số từ của nội dung điều, không kể dòng tiêu đề, trong phiên bản đầu tiên của văn bản. Không tính ba luật sửa đổi mà hồ sơ giữ như văn bản riêng (các điều của chúng là các điều sửa đổi), Luật Trẻ em và Luật Dân quân tự vệ (văn bản sai, xem vulnerabilities/). Khóa X chỉ có 2 văn bản.',
          'words in the body of each article, heading excluded, in the act’s first version. The three amending laws the record holds as acts (their articles are amendments), the Law on Children and the Law on Militia (wrong text, see vulnerabilities/) are left out. The 10th term has only 2 acts.'));
      table(el, [L('Khóa', 'Term'), L('Văn bản', 'Acts'), L('Điều', 'Articles'), ...names, L('Trung vị (từ)', 'Median (words)')], rows.map(r => [termShort(r.q), r.v.acts, r.v.arts, ...r.v.bins, r.v.median]));
    }
  };
});

// 19. delegation to the Government and to ministers
chart('c19', el => {
  const R = TROWS(), a11 = D.c18.QH11, a15 = D.c18.QH15;
  const noCodes = q => { const l = D.c18[q].acts_list.filter(a => ACTS[a[0]][7] === 'law'); return [sum(l, a => a[2]), sum(l, a => a[1])]; };
  const n13 = noCodes('QH13');
  return {
    title: L(`Giao Chính phủ quy định: ${pct(a15.gov, a15.arts)} số điều ở văn bản khóa XV, ${pct(a11.gov, a11.arts)} ở khóa XI`, `Left to the Government: ${pct(a15.gov, a15.arts)} of articles in the 15th term’s acts, ${pct(a11.gov, a11.arts)} in the 11th`),
    dek: L(`Tỷ lệ điều (khi văn bản được thông qua) giao cho Chính phủ hoặc Thủ tướng Chính phủ quy định (“Chính phủ quy định”, “theo quy định của Chính phủ”) và giao cho bộ trưởng (“Bộ trưởng … quy định”), theo khóa Quốc hội đã thông qua văn bản. Khóa XIII thấp vì năm bộ luật lớn ít giao việc: không tính các bộ luật và Hiến pháp, tỷ lệ giao Chính phủ của khóa XIII là ${pct(n13[0], n13[1])}.`,
      `The share of articles (when their act was adopted) that leave a matter for the Government or the Prime Minister to regulate (“Chính phủ quy định”, “theo quy định của Chính phủ”) and for a minister (“Bộ trưởng … quy định”), by the term that adopted the act. The 13th term is low because its five big codes delegate little: leaving out the codes and the Constitution, its share left to the Government is ${pct(n13[0], n13[1])}.`),
    draw(el) {
      const cG = css('--s1'), cM = css('--s7'), K = [['gov', L('Giao Chính phủ, Thủ tướng quy định', 'Left to the Government or Prime Minister'), cG], ['min', L('Giao bộ trưởng quy định', 'Left to a minister'), cM]];
      legend(el, K.map(([k, l, c]) => ({ c, l })));
      const w = W(el), nw = narrow(w), h = nw ? 250 : 290, m = { t: 20, r: 6, b: nw ? 40 : 40, l: 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleBand().domain(R.map(r => r[0])).range([0, iw]).padding(.26), xi = d3.scaleBand().domain(['gov', 'min']).range([0, x.bandwidth()]).padding(.08);
      const y = d3.scaleLinear().domain([0, d3.max(R, ([q, v]) => v.gov / v.arts)]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4, v => pv(100 * v));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      R.forEach(([q, v]) => {
        K.forEach(([k, l, c]) => {
          const x0 = x(q) + xi(k), bw = xi.bandwidth(), s = v[k] / v.arts;
          g.append('path').attr('d', colPath(x0, ih, bw, y(s))).attr('fill', c);
          g.append('text').attr('class', 'lbl strong').attr('x', x0 + bw / 2).attr('y', y(s) - 5).attr('text-anchor', 'middle').text(pct(v[k], v.arts));
        });
        g.append('text').attr('class', 'lbl strong').attr('x', x(q) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(nw ? ROM[q] : termShort(q));
        g.append('text').attr('class', 'lbl mut').attr('x', x(q) + x.bandwidth() / 2).attr('y', ih + 30).attr('text-anchor', 'middle').text(nw ? `${fmt(v.arts)}` : L(`${fmt(v.arts)} điều`, `${fmt(v.arts)} articles`));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(q) - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum([q, v]),
          ([qq, vv]) => `<b>${termShort(qq)} · ${termYears(qq)}</b>` + trow(null, L('Văn bản', 'Acts'), fmt(vv.acts)) + trow(null, L('Điều', 'Articles'), fmt(vv.arts)) + K.map(([k, l, c]) => trow(c, l, `${fmt(vv[k])} · ${pct(vv[k], vv.arts, 1)}`)).join(''));
      });
      note(el, ['<KIND>/<YEAR>/<NUMBER>/art-*.md (first version)'], L(`${fmt(sum(R, ([q, v]) => v.arts))} điều của ${fmt(sum(R, ([q, v]) => v.acts))} văn bản`, `${fmt(sum(R, ([q, v]) => v.arts))} articles of ${fmt(sum(R, ([q, v]) => v.acts))} acts`),
        L('một điều được tính một lần dù có nhiều cụm từ; “Bộ trưởng … quy định” không tính khi theo sau là “tại” hoặc “của” (dẫn chiếu, không giao việc). Cùng các văn bản như biểu đồ 18; khóa X chỉ có 2 văn bản.',
          'an article counts once however many phrases it holds; “Bộ trưởng … quy định” does not count when followed by “tại” or “của” (a reference, not a delegation). The same acts as chart 18; the 10th term has only 2 acts.'));
      table(el, [L('Khóa', 'Term'), L('Văn bản', 'Acts'), L('Điều', 'Articles'), L('Giao Chính phủ', 'To the Government'), L('Tỷ lệ', 'Share'), L('Giao bộ trưởng', 'To a minister'), L('Tỷ lệ', 'Share')],
        R.map(([q, v]) => [termShort(q), v.acts, v.arts, v.gov, pct(v.gov, v.arts, 1), v.min, pct(v.min, v.arts, 1)]));
      subTable(el, L('Từng văn bản', 'Each act'), [L('Văn bản', 'Act'), L('Khóa', 'Term'), L('Điều', 'Articles'), L('Giao Chính phủ', 'To the Government'), L('Giao bộ trưởng', 'To a minister'), L('Trung vị số từ', 'Median words')],
        R.flatMap(([q, v]) => v.acts_list.map(a => [actName(a[0]), termShort(q), a[1], a[2], a[3], a[4]])), [0, 0, 1, 1, 1, 1]);
    }
  };
});

// 20. the edits amendments make
chart('c20', el => {
  const c = D.c20, B = c.bins, n = c.n, under10 = B[0] + B[1] + B[2], mr = sum(c.money_ratio, r => r[1]), dbl = (c.money_ratio.find(r => r[0] === 2) || [2, 0])[1];
  return {
    title: L(`Sửa vài chữ: ${pct(under10, n)} số lần sửa một điều thay chưa đến 10% số từ của điều`, `A few words at a time: ${pct(under10, n)} of the changes to an article replace less than 10% of its words`),
    dek: L(`Bên trái: tỷ lệ số từ thay đổi trong ${fmt(n)} lần một điều được viết lại (không tính điều được thêm hoặc bãi bỏ). Trung vị là ${pv(100 * c.by_period.early)} với các lần sửa trước năm 2025 và ${pv(100 * c.by_period.late)} từ năm 2025. Bên phải: những thay đổi lặp lại nhiều nhất, theo số lần một điều có thay đổi đó: tên bộ, cấp huyện, thị trấn thành đặc khu, tòa án cấp cao và cấp huyện, số tiền tăng (${pct(dbl, mr)} gấp đôi), và cách đặt dấu thanh kiểu mới (“hoá” thành “hóa”).`,
      `Left: the share of words changed in the ${fmt(n)} times an article was rewritten (articles inserted or repealed are left out). The median is ${pv(100 * c.by_period.early)} for changes before 2025 and ${pv(100 * c.by_period.late)} since. Right: the edits that recur most, by the number of article changes that contain them: ministry names, the district level, townships becoming special zones, high and district courts, amounts raised (${pct(dbl, mr)} of them doubled), and tone marks placed the newer way (“hoá” to “hóa”).`),
    draw(el) {
      const box = el.append('div').attr('class', 'mini').style('grid-template-columns', narrow(W(el)) ? '1fr' : '1fr 1.55fr');
      const p1 = box.append('div'), p2 = box.append('div');
      // (a) the share of words changed
      const nwp = narrow(W(el)), BN = nwp ? ['<2', '2–5', '5–10', '10–25', '25–50', '50–75', '>75'] : ['<2%', '2–5%', '5–10%', '10–25%', '25–50%', '50–75%', '>75%'];
      p1.append('h4').text(L('Tỷ lệ số từ thay đổi', 'Share of words changed'));
      p1.append('p').text(L(`${fmt(n)} lần một điều được viết lại` + (nwp ? ' (%)' : ''), `${fmt(n)} rewritten articles` + (nwp ? ' (%)' : '')));
      { const w = WR(p1), h = 230, m = { t: 18, r: 4, b: 24, l: 36 }, svg = svgIn(p1, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(d3.range(7)).range([0, iw]).padding(.2), y = d3.scaleLinear().domain([0, d3.max(B)]).nice().range([ih, 0]);
        yAxis(g, y, iw, 4); g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        B.forEach((v, i) => { const x0 = x(i), bw = x.bandwidth(), col = i < 3 ? css('--s2') : css('--s1');
          g.append('path').attr('d', colPath(x0, ih, bw, y(v))).attr('fill', col).attr('fill-opacity', i < 3 ? 1 : .55);
          g.append('text').attr('class', 'lbl strong').attr('x', x0 + bw / 2).attr('y', y(v) - 5).attr('text-anchor', 'middle').text(pct(v, n));
          g.append('text').attr('class', 'lbl').style('font-size', '10px').attr('x', x0 + bw / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(BN[i]);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0).attr('width', bw).attr('y', 0).attr('height', ih).datum(i), j => `<b>${BN[j]}</b>` + trow(null, L('Lần sửa một điều', 'Article changes'), `${fmt(B[j])} · ${pct(B[j], n, 1)}`)); }); }
      // (b) the edits that recur
      const TH = { ministry: [L('Tên bộ', 'Ministry names'), css('--s1')], local: [L('Chính quyền địa phương và tòa án', 'Local government and courts'), css('--s2')], spelling: [L('Chính tả', 'Spelling'), css('--s7')], amount: [L('Số tiền', 'Amounts'), css('--s4')] };
      const LBL = { MONRE: ['Bộ Tài nguyên và Môi trường → Bộ Nông nghiệp và Môi trường', 'Natural Resources and Environment → Agriculture and Environment'],
        MARD: ['Bộ Nông nghiệp và Phát triển nông thôn → Bộ Nông nghiệp và Môi trường', 'Agriculture and Rural Development → Agriculture and Environment'],
        MOT: ['Bộ Giao thông vận tải → Bộ Xây dựng', 'Transport → Construction'], MPI: ['Bộ Kế hoạch và Đầu tư → Bộ Tài chính', 'Planning and Investment → Finance'],
        MOLISA: ['Bộ Lao động - Thương binh và Xã hội → Bộ Nội vụ', 'Labour, Invalids and Social Affairs → Home Affairs'], MIC: ['Bộ Thông tin và Truyền thông → bộ khác', 'Information and Communications → another ministry'],
        'huyen-xa': ['cấp huyện → cấp xã', 'district level → commune level'], 'huyen-tinh': ['cấp huyện → cấp tỉnh', 'district level → provincial level'],
        'court-kv': ['Tòa án, Viện kiểm sát cấp huyện → khu vực', 'district courts and procuracies → regional'], 'court-cao': ['Tòa án, Viện kiểm sát cấp cao → cấp tỉnh, tối cao', 'high courts and procuracies → provincial, supreme'],
        thitran: ['thị trấn → đặc khu', 'township → special zone'], tone: ['hoá → hóa, Uỷ → Ủy (dấu thanh)', 'hoá → hóa, Uỷ → Ủy (tone marks)'], money: [`số tiền tăng, ${pct(dbl, mr)} gấp đôi (100.000.000 → 200.000.000 đồng)`, `amounts raised, ${pct(dbl, mr)} doubled (100,000,000 → 200,000,000 đồng)`] };
      const LBS = { MONRE: ['Bộ TN&MT → Bộ NN&MT', 'MONRE → MAE'], MARD: ['Bộ NN&PTNT → Bộ NN&MT', 'MARD → MAE'], MOT: ['Bộ GTVT → Bộ Xây dựng', 'Transport → Construction'],
        MPI: ['Bộ KH&ĐT → Bộ Tài chính', 'Planning → Finance'], MOLISA: ['Bộ LĐ-TB&XH → Bộ Nội vụ', 'MOLISA → Home Affairs'], MIC: ['Bộ TT&TT → bộ khác', 'MIC → other ministries'],
        'court-kv': ['Tòa án, VKS cấp huyện → khu vực', 'district courts → regional'], 'court-cao': ['Tòa án, VKS cấp cao → tỉnh, tối cao', 'high courts → provincial, supreme'],
        money: [`số tiền tăng (${pct(dbl, mr)} gấp đôi)`, `amounts raised (${pct(dbl, mr)} doubled)`], tone: ['hoá → hóa, Uỷ → Ủy', 'hoá → hóa, Uỷ → Ủy'] };
      const R = c.swaps.filter(s => s[2] > 0).sort((a, b) => b[2] - a[2]);
      p2.append('h4').text(L('Những thay đổi lặp lại nhiều nhất', 'The edits that recur most'));
      legend(p2, Object.values(TH).map(([l, cc]) => ({ c: cc, l })));
      { const w = WR(p2), nw = w < 420, rowH = nw ? 34 : 22, lw = nw ? 0 : Math.min(w * .6, textW(p2, R.map(r => LA(LBL[r[0]])), 'lbl') + 10);
        const svg = svgIn(p2, w, rowH * R.length + 4), g = svg.append('g').attr('transform', `translate(${lw},2)`);
        const rr = Math.ceil(textW(p2, R.map(r => fmt(r[2])), 'lbl')) + 8, iw = w - lw - rr, x = d3.scaleLinear().domain([0, d3.max(R, r => r[2])]).range([0, iw]);
        R.forEach((r, i) => {
          const cy = i * rowH, bh = 10, y0 = cy + rowH - bh - 5, col = TH[r[1]][1];
          if (nw) g.append('text').attr('class', 'lbl').attr('x', 0).attr('y', cy + 11).text(LA(textW(p2, [LA(LBL[r[0]])], 'lbl') > w - 8 && LBS[r[0]] ? LBS[r[0]] : LBL[r[0]]));
          else g.append('text').attr('class', 'lbl').attr('x', -8).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(LA(LBL[r[0]]));
          g.append('path').attr('d', barPath(0, y0, Math.max(2, x(r[2])), bh, 3)).attr('fill', col);
          g.append('text').attr('class', 'lbl strong').attr('x', Math.max(2, x(r[2])) + 5).attr('y', y0 + bh / 2 + 4).text(fmt(r[2]));
          bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
            d => `<b>${esc(LA(LBL[d[0]]))}</b>` + trow(TH[d[1]][1], L('Lần sửa một điều', 'Article changes'), fmt(d[2])) + trow(null, L('Văn bản', 'Acts'), fmt(d[3])) + `<div class="q">${d[4].map(([pr, k]) => `“${esc(pr[0])}” → “${esc(pr[1])}” (${fmt(k)})`).join('<br>')}</div>`);
        }); }
      note(el, ['git log -p (art-*.md)'], L(`${fmt(n)} lần một điều được viết lại`, `${fmt(n)} rewritten articles`),
        L('so sánh từng từ của điều trước và sau khi sửa (difflib); một thay đổi được tính khi cụm từ cũ ở phần bị thay và cụm từ mới ở phần thay vào, kể cả 5 từ chung quanh. Một điều được tính một lần cho mỗi loại thay đổi trong một lần sửa.',
          'each article compared word by word before and after the change (difflib); an edit counts when the old phrase lies in the replaced words and the new phrase in the words put in, with 5 words around. An article counts once per kind of edit per amendment.'));
      table(el, [L('Thay đổi', 'Edit'), L('Nhóm', 'Group'), L('Lần sửa một điều', 'Article changes'), L('Văn bản', 'Acts')], R.map(r => [LA(LBL[r[0]]), TH[r[1]][0], r[2], r[3]]));
      subTable(el, L('Tỷ lệ số từ thay đổi', 'Share of words changed'), [L('Tỷ lệ', 'Share'), L('Lần sửa một điều', 'Article changes'), t('share')], B.map((v, i) => [BN[i], v, pct(v, n, 1)]), [0, 1, 1]);
    }
  };
});
