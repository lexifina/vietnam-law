  c04: ['Từ thông qua đến có hiệu lực', 'From adoption to entry into force'], c05: ['Số lần sửa mỗi năm', 'Amendments per year'], c06: ['Một luật sửa nhiều văn bản', 'One law, many acts'],
  c07: ['Bao lâu thì được sửa lần đầu', 'Time to the first amendment'], c08: ['Lĩnh vực và năm', 'Fields and years'], c09: ['Ai viết văn bản hiện hành', 'Who wrote the text in force'],
  c10: ['Hiến pháp năm 2013', 'The Constitution of 2013'], c11: ['Hiến pháp được viện dẫn', 'The constitution cited'], c12: ['Hiến pháp và sáu bộ luật', 'The Constitution and the six codes'],
  c13: ['Hình phạt trong Bộ luật Hình sự', 'Penalties in the Penal Code'], c14: ['Tử hình', 'The death penalty'], c15: ['Những ngày thay đổi', 'The days of change'],
  c16: ['“Cấp huyện”', '“District level”'], c17: ['Tên các bộ', 'Ministry names'], c18: ['Độ dài của điều luật', 'The length of articles'], c19: ['Giao Chính phủ quy định', 'Left to the Government'],
  c20: ['Những chữ được sửa', 'The words amended'] };
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Văn bản và điều', 'Acts and articles'), '<KIND>/<YEAR>/<NUMBER>/art-*.md', fmt(P.acts), L(`Hiến pháp năm 2013, ${P.codes} bộ luật và ${P.laws_only} luật của Quốc hội; mỗi điều một tệp, ${fmt(P.articles)} điều đang có hiệu lực, ${fmt(P.words)} từ`, `the Constitution of 2013, ${P.codes} codes and ${P.laws_only} laws of the National Assembly; one file per article, ${fmt(P.articles)} articles in force, ${fmt(P.words)} words`),
      L(`không có pháp lệnh, nghị quyết, nghị định, thông tư; ${fmt(P.replaced.length)} văn bản đã được văn bản sau trong hồ sơ thay thế vẫn giữ văn bản cuối cùng`, `no ordinances, resolutions, decrees or circulars; ${fmt(P.replaced.length)} acts replaced by a later act of the record keep their last text`)],
    [L('Lịch sử git', 'Git history'), 'git log origin/main', fmt(P.law_commits), L(`mỗi luật một commit vào ngày có hiệu lực (In-force:), tác giả là luật đã sửa; ${fmt(P.am_events)} lần một văn bản được sửa, ${fmt(P.art_changes)} lần một điều được sửa (${fmt(P.modified)} viết lại, ${fmt(P.inserted)} thêm, ${fmt(P.removed)} bãi bỏ)`,
      `one commit per law on the day it took effect (In-force:), the amending law as author; ${fmt(P.am_events)} amendments of an act, ${fmt(P.art_changes)} changes to an article (${fmt(P.modified)} rewritten, ${fmt(P.inserted)} inserted, ${fmt(P.removed)} repealed)`),
      L('khi hai luật cùng sửa một điều mà không có văn bản hợp nhất ở giữa, cả hai thay đổi hiện vào ngày của luật sau (46 điều, REPRODUCE.md)', 'where two laws changed an article and no consolidated text shows it between them, both changes appear on the later law’s day (46 articles, REPRODUCE.md)')],
    [L('Danh sách luật', 'The laws named'), 'data/laws.csv', fmt(P.laws), L('các văn bản và các luật đã sửa chúng, với ngày thông qua, ngày có hiệu lực và tên', 'the acts and the laws that amended them, with adoption day, day in force and title'), L('20 luật chưa có ngày có hiệu lực trong hồ sơ', '20 laws have no day in force in the record')],
    [L('Phiên bản', 'Versions'), 'data/versions.json', fmt(P.versions), L(`các phiên bản đã có hiệu lực từ ${dateShort(P.record_from)} đến ${dateShort(P.record_to)}`, `the versions in force from ${dateShort(P.record_from)} to ${dateShort(P.record_to)}`), L(`${fmt(P.future)} phiên bản về sau, đến 1/3/2027, chưa phải commit và không được tính`, `${fmt(P.future)} later versions, to 1 Mar 2027, are not commits yet and are not counted`)],
    [L('Văn bản của từng điều', 'The text of every article'), 'art-*.md · loi-mo-dau.md · ket-thuc.md · cau-truc.md', L('mọi phiên bản', 'every version'), L('độ dài, cụm từ, căn cứ của văn bản, kỳ họp thông qua, hình phạt, ai viết từng dòng', 'length, phrases, the constitution cited, the session of adoption, penalties, who wrote each line'),
      L('Luật Trẻ em và Luật Dân quân tự vệ giữ một phần văn bản của văn bản khác (vulnerabilities/); hai luật này không được tính trong các số đo về câu chữ. Quy tắc phân loại nằm trong src/prep.py', 'the Law on Children and the Law on Militia hold part of another document’s text (vulnerabilities/) and are left out of the measures of wording. The rules that classify are in src/prep.py')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  const fill = s => s.replace('{acts}', fmt(PF.acts)).replace('{laws}', fmt(PF.laws_only)).replace('{named}', fmt(PF.laws)).replace('{chg}', fmt(PF.art_changes));
  d3.selectAll('[data-i]').each(function () { this.textContent = fill(t(this.dataset.i)); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[fmt(PF.acts), L('văn bản của Quốc hội', 'acts of the National Assembly')], [fmt(PF.articles), L('điều, mỗi điều một tệp', 'articles, one file each')], [L(`${dec(PF.words / 1e6, 2)} triệu`, `${dec(PF.words / 1e6, 2)} million`), L('từ đang có hiệu lực', 'words in force')],
    [fmt(PF.versions), L('phiên bản đã có hiệu lực', 'versions in force')], [fmt(PF.art_changes), L('lần một điều được sửa, thêm hoặc bãi bỏ', 'changes to an article')], [fmt(PF.amending_laws), L('luật đã sửa các văn bản', 'laws that amended the acts')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.vi, c.en)); sec.append('p').attr('class', 'pd').text(fill(L(c.dvi, c.den)).replace('{laws}', fmt(PF.amending_laws)));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.vi, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${TOCN[c.id] ? LA(TOCN[c.id]) : spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')).replace('{record}', dateTxt(PF.retrieved)));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('vn-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('vn-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
